id: 5257980c-9939-4a1c-9ebc-d0bdae5cdabc
name: Microsoft Sentinel Analytics Rule - Standard Template
description: |
  Alert when a single IP address produces ten or more failed Entra ID sign-ins within an hour.
severity: Medium
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - SigninLogs
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
enabled: false
tactics:
  - CredentialAccess
relevantTechniques:
  - T1110
  - T1110.003
query: |
  SigninLogs
  | where ResultType != 0
  | summarize FailedAttempts = count(),
              TargetedAccounts = dcount(UserPrincipalName),
              AccountList = make_set(UserPrincipalName, 100)
            by IPAddress, bin(TimeGenerated, 1h)
  | where FailedAttempts >= 10
  | project TimeGenerated, IPAddress, FailedAttempts,
            TargetedAccounts, AccountList
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPAddress
alertDetailsOverride:
  alertDisplayNameFormat: Suspicious sign-ins for {{UserPrincipalName}} from {{IPAddress}}
  alertDescriptionFormat: "{{UserPrincipalName}} had {{FailedAttempts}} failed sign-ins from {{UniqueIPs}} distinct IPs. Risk score: {{RiskScore}}."
  alertSeverityColumnName: RiskScore
  alertTacticsColumnName: ""
customDetails:
  FailedAttempts: FailedAttempts
  UniqueIPs: UniqueIPs
  RiskScore: RiskScore
eventGroupingSettings:
  aggregationKind: SingleAlert
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: false
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: AllEntities
    groupByEntities:
      - Account
      - IP
suppressionDuration: PT5H
suppressionEnabled: false
version: 1.0.0
kind: Scheduled
tags:
  - SecurityOps
