# ---------------------------------------------------------------------------
# Azure DevOps Pipeline: PR Validation Gate
# ---------------------------------------------------------------------------
# Equivalent of .github/workflows/pr-validation.yml for Azure-DevOps-hosted
# repos. Calls Tools/Invoke-PRValidation.ps1, which runs every Pester
# suite under Tests/ (drift-detector pure functions + AnalyticalRules /
# HuntingQueries YAML schema). The pipeline fails if any test fails, which
# blocks the PR when wired up as a build-validation policy.
#
# Wiring this as a hard merge gate:
#
#   Project Settings -> Repos -> Repositories -> <repo> -> Policies
#     Branch policies for: main, and for release/* (a long-lived release
#     branch gets the same gate before it merges to main)
#       Build validation -> + Add build policy
#         Build pipeline:        Sentinel-PR-Validation
#         Path filter:           Content/AnalyticalRules/*;Content/HuntingQueries/*;Modules/*;Deploy/*;Tools/*;Tests/*;dependencies.json;Pipelines/*;.github/workflows/*
#         Trigger:               Automatic
#         Policy requirement:    Required
#         Build expiration:      Immediately when {repo} is updated
#         Display name:          PR Validation
#
# Once the policy is required, the PR's Complete button is disabled until
# this pipeline reports success against the latest commit.
#
# No Azure auth needed - validation is fully offline (YAML parse + schema
# checks + AST-based PowerShell function tests with mocks). The pool is
# ubuntu-latest for parity with the GitHub workflow.
#
# Engine for the dependency manifest check (the iSOCDeployments pipeline
# switch). A PR build always takes the default; queue the pipeline by hand
# to choose another.
#   - scripts  -> Tools/Build-DependencyManifest.ps1 -Mode Verify (default)
#   - module   -> Test-iSOCDependencyManifest from Modules/iSOCDeployments
#   - compare  -> both, failing when they disagree, then the gate as usual
# ---------------------------------------------------------------------------

# 'pr' triggers run when a PR is opened/updated. Build-validation policy
# (configured per the comment block above) is what enforces the gate; this
# 'pr' block ensures the pipeline runs automatically against PR commits even
# without the policy in place.
pr:
  branches:
    include:
      - main
      - release/*
  paths:
    include:
      - Content/AnalyticalRules
      - Content/HuntingQueries
      - Modules
      - Deploy
      - Tools
      - Tests
      - dependencies.json
      - Pipelines
      - .github/workflows

# CI on push to main ensures we have a green baseline; if main ever goes red
# the most recent run is the place to start the post-mortem.
trigger:
  branches:
    include:
      - main
      - release/*
  paths:
    include:
      - Content/AnalyticalRules
      - Content/HuntingQueries
      - Modules
      - Deploy
      - Tools
      - Tests
      - dependencies.json
      - Pipelines
      - .github/workflows

parameters:
  - name: engine
    displayName: "Dependency manifest engine: scripts, module (iSOCDeployments) or compare (both, failing when they disagree)"
    type: string
    default: scripts
    values:
      - scripts
      - module
      - compare

variables:
  # Pinned module versions. Keep in step with PESTER_VERSION and
  # YAML_VERSION in .github/workflows/pr-validation.yml and with
  # Sentinel-Blueprint.yml, so the two gates agree on what passes.
  - name: pesterVersion
    value: "5.7.1"
  - name: yamlVersion
    value: "0.4.12"
  - name: testResultsFile
    value: "$(Build.SourcesDirectory)/test-results/pester-results.xml"

stages:
  - stage: Validate
    displayName: "PR Validation"
    jobs:
      - job: RunPRValidation
        displayName: "Pester suite + YAML schema"
        pool:
          vmImage: "ubuntu-latest"
        timeoutInMinutes: 15

        steps:
          - checkout: self
            fetchDepth: 1

          - task: PowerShell@2
            displayName: "Install Pester, powershell-yaml and PnP.PowerShell"
            inputs:
              targetType: "inline"
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'
                if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -eq [version]'$(pesterVersion)' })) {
                    Install-Module -Name Pester -RequiredVersion '$(pesterVersion)' -Force -SkipPublisherCheck -Scope CurrentUser -AllowClobber
                }
                if (-not (Get-Module -ListAvailable -Name powershell-yaml | Where-Object { $_.Version -eq [version]'$(yamlVersion)' })) {
                    Install-Module -Name powershell-yaml -RequiredVersion '$(yamlVersion)' -Force -Scope CurrentUser -AllowClobber
                }
                # PnP.PowerShell for Tests/iSOCBlueprint/SharePoint-PnPCalls.Tests.ps1,
                # which checks every PnP call in the SharePoint scripts against the
                # version the Blueprint pipeline pins. Read from that pipeline so
                # the two cannot drift; the suite fails in CI when it is missing.
                $blueprint = Get-Content -Raw -LiteralPath "$(Build.SourcesDirectory)/Pipelines/Sentinel-Blueprint.yml"
                if ($blueprint -notmatch '(?m)-\s*name:\s*pnpVersion\s*\r?\n\s*value:\s*"?(?<v>[\d.]+)"?') {
                    throw 'pnpVersion not found in Pipelines/Sentinel-Blueprint.yml'
                }
                $pnpVersion = $Matches['v']
                if (-not (Get-Module -ListAvailable -Name PnP.PowerShell | Where-Object { [string]$_.Version -eq $pnpVersion })) {
                    Install-Module -Name PnP.PowerShell -RequiredVersion $pnpVersion -Force -Scope CurrentUser -AllowClobber
                }
                Get-Module -ListAvailable Pester, powershell-yaml, PnP.PowerShell | Format-Table Name, Version

          - task: PowerShell@2
            displayName: "Run PR validation"
            inputs:
              targetType: "inline"
              pwsh: true
              script: |
                & "$(Build.SourcesDirectory)/Tools/Invoke-PRValidation.ps1" `
                    -RepoPath        "$(Build.SourcesDirectory)" `
                    -TestResultsPath "$(testResultsFile)" `
                    -InstallModules:$false

          # Drift-check the dependency manifest against discovery. Same gate
          # as the GH Actions dependency-manifest job — fails the PR if the
          # on-disk dependencies.json doesn't match what discovery produces
          # from the current content. Author fix: run
          # `./Tools/Build-DependencyManifest.ps1 -Mode Generate` locally
          # and commit the result, or wait for the daily auto-PR workflow
          # to open one.
          - ${{ if eq(parameters.engine, 'scripts') }}:
            - task: PowerShell@2
              displayName: "Verify dependency manifest"
              inputs:
                targetType: "inline"
                pwsh: true
                script: |
                  & "$(Build.SourcesDirectory)/Tools/Build-DependencyManifest.ps1" -Mode Verify -RepoPath "$(Build.SourcesDirectory)"
                  if ($LASTEXITCODE -ne 0) {
                      Write-Host "##vso[task.logissue type=error]dependencies.json is out of sync with content."
                      Write-Host "##vso[task.logissue type=error]Fix: run ./Tools/Build-DependencyManifest.ps1 -Mode Generate locally and commit the result."
                      exit 1
                  }

          # The module steps may not set variables or change PATH: they log
          # text read from the PR's content files.
          - ${{ if eq(parameters.engine, 'module') }}:
            - task: PowerShell@2
              displayName: "Verify dependency manifest (iSOCDeployments)"
              target:
                commands: restricted
                settableVariables: none
              inputs:
                targetType: "inline"
                pwsh: true
                script: |
                  Import-Module (Join-Path $env:BUILD_SOURCESDIRECTORY 'Modules/iSOCDeployments/iSOCDeployments.psd1') -Force
                  $result = Test-iSOCDependencyManifest -RepoPath $env:BUILD_SOURCESDIRECTORY
                  if (-not $result.Exists -or $result.HasDrift) {
                      Write-Host '##vso[task.logissue type=error]dependencies.json is out of sync with content.'
                      Write-Host '##vso[task.logissue type=error]Fix: run Update-iSOCDependencyManifest locally and commit the result.'
                      exit 1
                  }

          - ${{ if eq(parameters.engine, 'compare') }}:
            - task: PowerShell@2
              displayName: "Verify dependency manifest (compare the scripts and iSOCDeployments)"
              target:
                commands: restricted
                settableVariables: none
              inputs:
                targetType: "inline"
                pwsh: true
                script: |
                  $repo = $env:BUILD_SOURCESDIRECTORY
                  & (Join-Path $repo 'Tools/Build-DependencyManifest.ps1') -Mode Verify -RepoPath $repo
                  $scriptsCurrent = $LASTEXITCODE -eq 0

                  Import-Module (Join-Path $repo 'Modules/iSOCDeployments/iSOCDeployments.psd1') -Force
                  $result = Test-iSOCDependencyManifest -RepoPath $repo
                  $moduleCurrent = $result.Exists -and -not $result.HasDrift

                  if ($scriptsCurrent -ne $moduleCurrent) {
                      Write-Host "##vso[task.logissue type=error]The engines disagree: Tools/Build-DependencyManifest.ps1 says the manifest is $(if ($scriptsCurrent) { 'current' } else { 'out of date' }), Test-iSOCDependencyManifest says $(if ($moduleCurrent) { 'current' } else { 'out of date' }). Modules/iSOCDeployments/MIGRATION.md lists the differences the module makes on purpose (E8: it reads .yml content files as well as .yaml)."
                      exit 1
                  }
                  if (-not $moduleCurrent) {
                      Write-Host '##vso[task.logissue type=error]dependencies.json is out of sync with content.'
                      Write-Host '##vso[task.logissue type=error]Fix: run ./Tools/Build-DependencyManifest.ps1 -Mode Generate locally and commit the result.'
                      exit 1
                  }
                  Write-Host 'The scripts and the module agree that dependencies.json is current.'

          - task: PublishTestResults@2
            displayName: "Publish Pester results"
            condition: always()
            inputs:
              testResultsFormat: "NUnit"
              testResultsFiles: "$(testResultsFile)"
              testRunTitle: "Pester PR Validation"
              failTaskOnFailedTests: false   # Pester step already exited non-zero
              publishRunAttachments: true

          - task: PublishPipelineArtifact@1
            displayName: "Upload Pester report"
            condition: always()
            inputs:
              targetPath: "$(Build.SourcesDirectory)/test-results"
              artifactName: "pester-results-$(Build.BuildId)"
