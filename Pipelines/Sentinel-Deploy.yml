# ---------------------------------------------------------------------------
# Azure DevOps Pipeline: Deploy Microsoft Sentinel Infrastructure & Content
# ---------------------------------------------------------------------------
# This pipeline provisions Sentinel infrastructure via Bicep (if needed) and
# then deploys Content Hub solutions and their associated content (Analytics
# Rules, Workbooks, Automation Rules, Hunting Queries) to the workspace.
#
# Prerequisites:
#   - Azure Service Connection with Contributor + Microsoft Sentinel Contributor
#     roles on the target Subscription / Resource Group
#   - Az.Accounts PowerShell module (installed in pipeline)
#
# Usage:
#   Trigger manually or via schedule. Override parameters at queue time
#   to target specific solutions or toggle content switches.
#
# Every stage runs the iSOCDeployments module (Modules/iSOCDeployments):
# Get-iSOCWorkspaceOnboarding for the check, a stage of its own for the
# workspace settings, and Deploy-iSOCWorkspace -Stage for each content stage.
# Registering providers, Bicep, the waits and the deployment state stay
# pipeline steps.
# ---------------------------------------------------------------------------

trigger: none

schedules:
  - cron: "0 4 * * 1"
    displayName: "Weekly Monday 04:00 UTC"
    branches:
      include:
        - main
    always: false

parameters:
  # ── Stage Toggles ──────────────────────────────────────────────────────
  - name: deployInfrastructure
    displayName: "── Stage 1-2: Deploy Infrastructure (Bicep)"
    type: boolean
    default: true

  - name: deployContentHub
    displayName: "── Stage 3: Deploy Content Hub Solutions"
    type: boolean
    default: true

  - name: deployCustomContent
    displayName: "── Stage 4: Deploy Custom Content"
    type: boolean
    default: true

  - name: deployDefenderDetections
    displayName: "── Stage 5: Deploy Defender XDR Custom Detections"
    type: boolean
    default: true

  # ── Infrastructure (Stage 2) ───────────────────────────────────────────
  - name: dailyQuota
    displayName: "  Bicep › Daily Quota (GB, 0 = unlimited)"
    type: number
    default: 0

  - name: retentionInDays
    displayName: "  Bicep › Interactive Retention (days, 30-730)"
    type: number
    default: 90

  - name: totalRetentionInDays
    displayName: "  Bicep › Total Retention incl. Archive (0 = same as interactive)"
    type: number
    default: 0

  # ── Content Hub (Stage 3) ──────────────────────────────────────────────
  - name: solutions
    displayName: "  Content Hub › Solutions (comma-separated)"
    type: string
    default: "Analytics Health & Audit,Azure Activity,Azure DevOps Auditing,Azure Key Vault,Azure Logic Apps,Azure Network Security Groups,Azure Resource Graph,Azure Storage,Common Event Format,Data Collection Rule Toolkit,Microsoft 365,Microsoft Defender for Cloud,Microsoft Defender for Cloud Apps,Microsoft Defender for Endpoint,Microsoft Defender for Identity,Microsoft Defender Threat Intelligence,Microsoft Defender XDR,Microsoft Entra ID,Microsoft Sentinel Optimization Workbook,SOC Handbook,Summary Rules Workbook,Syslog,Threat Intelligence (NEW),Windows Security Events,Windows Server DNS,Workspace Usage Report"

  - name: severitiesToInclude
    displayName: "  Content Hub › Analytics Rule Severities"
    type: string
    default: "High,Medium,Low,Informational"

  - name: disableRules
    displayName: "  Content Hub › Deploy Analytics Rules as Disabled"
    type: boolean
    default: true

  - name: protectCustomisedRules
    displayName: "  Content Hub › Protect Customised Rules from Overwrite"
    type: boolean
    default: true

  - name: skipAnalyticsRules
    displayName: "  Content Hub › Skip Analytics Rules"
    type: boolean
    default: false

  - name: skipWorkbooks
    displayName: "  Content Hub › Skip Workbooks"
    type: boolean
    default: false

  - name: skipAutomationRules
    displayName: "  Content Hub › Skip Automation Rules"
    type: boolean
    default: false

  - name: skipHuntingQueries
    displayName: "  Content Hub › Skip Hunting Queries"
    type: boolean
    default: false

  - name: forceSolutionUpdate
    displayName: "  Content Hub › Force Solution Update (even if current)"
    type: boolean
    default: false

  - name: forceContentDeployment
    displayName: "  Content Hub › Force Content Redeployment (even if current)"
    type: boolean
    default: false

  # ── Custom Content (Stage 4) ───────────────────────────────────────────
  - name: skipCustomParsers
    displayName: "  Custom › Skip Parsers (YAML)"
    type: boolean
    default: false

  - name: skipCustomDetections
    displayName: "  Custom › Skip Detections (YAML)"
    type: boolean
    default: false

  - name: skipCommunityDetections
    displayName: "  Custom > Skip Community Detections (Dalonso)"
    type: boolean
    default: true

  - name: skipCustomWatchlists
    displayName: "  Custom › Skip Watchlists (JSON+CSV)"
    type: boolean
    default: false

  - name: skipCustomPlaybooks
    displayName: "  Custom › Skip Playbooks (ARM)"
    type: boolean
    default: false

  - name: skipCustomWorkbooks
    displayName: "  Custom › Skip Workbooks (Gallery JSON)"
    type: boolean
    default: false

  - name: skipCustomHuntingQueries
    displayName: "  Custom › Skip Hunting Queries (YAML)"
    type: boolean
    default: false

  - name: skipCustomAutomationRules
    displayName: "  Custom › Skip Automation Rules (JSON)"
    type: boolean
    default: false

  - name: skipCustomSummaryRules
    displayName: "  Custom › Skip Summary Rules (JSON)"
    type: boolean
    default: false

  - name: smartDeployment
    displayName: "  Custom › Smart Deployment (only deploy changed files)"
    type: boolean
    default: true

  # ── General ────────────────────────────────────────────────────────────
  - name: whatIf
    displayName: "🔍 Dry Run — preview changes without applying"
    type: boolean
    default: false

variables:
  - group: sentinel-deployment      # Variable group containing:
                                     #   - azureSubscriptionId
                                     #   - sentinelResourceGroup
                                     #   - sentinelWorkspaceName
                                     #   - sentinelRegion
                                     #   - playbookResourceGroup (optional, defaults to sentinelResourceGroup)
  - name: serviceConnection
    value: "sc-sentinel-as-code"
  - name: SuppressAzurePowerShellBreakingChangeWarnings
    value: "true"

  # Pinned module version. Keep in step with YAML_VERSION in the GitHub
  # workflows and yamlVersion in Sentinel-Blueprint.yml.
  - name: yamlVersion
    value: "0.4.12"

stages:
  # =================================================================================
  # Stage 1: Check Existing Resources
  # Checks whether the Resource Group, the Log Analytics Workspace, the two
  # Sentinel onboarding resources and the playbook Resource Group exist.
  # Handles the case where the RG doesn't exist yet (greenfield deployment).
  # If everything is found, the Bicep deployment stage is skipped.
  # =================================================================================
  - stage: CheckInfrastructure
    displayName: "Check Existing Infrastructure"
    condition: and(succeeded(), eq('${{ parameters.deployInfrastructure }}', 'True'))
    jobs:
      - job: CheckResources
        displayName: "Verify Existing Sentinel Resources"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self

          # The check sets RESOURCES_EXIST, which the infrastructure stage's
          # condition reads, and DEPLOY_SENTINEL, which Bicep reads.
          - task: AzurePowerShell@5
            displayName: "Check for Existing Resources"
            name: CheckSentinelResources
            target:
              commands: restricted
              settableVariables:
                - RESOURCES_EXIST
                - DEPLOY_SENTINEL
            inputs:
              azureSubscription: $(serviceConnection)
              ScriptType: "InlineScript"
              pwsh: true
              azurePowerShellVersion: LatestVersion
              Inline: |
                $ErrorActionPreference = 'Stop'
                Import-Module (Join-Path $env:BUILD_SOURCESDIRECTORY 'Modules/iSOCDeployments/iSOCDeployments.psd1') -Force
                # An unset variable reaches the step as its own macro text.
                $playbookGroup = if ($env:PLAYBOOK_RESOURCE_GROUP -like '$(*') { '' } else { $env:PLAYBOOK_RESOURCE_GROUP }
                $onboarding = Get-iSOCWorkspaceOnboarding -SubscriptionId $env:SENTINEL_SUBSCRIPTION_ID -ResourceGroup $env:SENTINEL_RESOURCE_GROUP -WorkspaceName $env:SENTINEL_WORKSPACE_NAME -PlaybookResourceGroup $playbookGroup
                $resourcesExist = (-not $onboarding.InfrastructureNeeded).ToString().ToLower()
                $deploySentinel = $onboarding.DeploySentinel.ToString().ToLower()
                Write-Host "##vso[task.setvariable variable=RESOURCES_EXIST;isOutput=true]$resourcesExist"
                Write-Host "##vso[task.setvariable variable=DEPLOY_SENTINEL;isOutput=true]$deploySentinel"
                exit $onboarding.ExitCode
            env:
              SENTINEL_SUBSCRIPTION_ID: $(azureSubscriptionId)
              SENTINEL_RESOURCE_GROUP: $(sentinelResourceGroup)
              SENTINEL_WORKSPACE_NAME: $(sentinelWorkspaceName)
              PLAYBOOK_RESOURCE_GROUP: $(playbookResourceGroup)

  # =================================================================================
  # Stage 2: Deploy Infrastructure (Bicep)
  # Registers required resource providers, then provisions the Resource Group,
  # Log Analytics Workspace, Sentinel, Entity Analytics, and UEBA.
  # Skipped if the workspace already exists or if deployInfrastructure is false.
  # =================================================================================
  - stage: DeployInfrastructure
    displayName: "Deploy Sentinel Infrastructure (Bicep)"
    dependsOn: CheckInfrastructure
    condition: |
      and(
        succeeded(),
        eq('${{ parameters.deployInfrastructure }}', 'True'),
        eq(dependencies.CheckInfrastructure.outputs['CheckResources.CheckSentinelResources.RESOURCES_EXIST'], 'false')
      )
    jobs:
      - job: DeployBicep
        displayName: "Deploy Bicep Templates"
        pool:
          vmImage: "ubuntu-latest"
        variables:
          # From the check; when it is empty the template's default (deploy
          # Sentinel) stands.
          - name: deploySentinel
            value: $[ stageDependencies.CheckInfrastructure.CheckResources.outputs['CheckSentinelResources.DEPLOY_SENTINEL'] ]
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: "Register Required Resource Providers"
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                echo "##[section]Registering required resource providers"
                az provider register --namespace Microsoft.OperationsManagement --wait
                az provider register --namespace Microsoft.SecurityInsights --wait
                echo "Resource providers registered successfully."

          - task: AzureCLI@2
            displayName: "Deploy Sentinel Infrastructure with Bicep"
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                echo "##[section]Starting Bicep Deployment"
                echo "Region: $(sentinelRegion)"
                echo "Resource Group: $(sentinelResourceGroup)"
                echo "Workspace: $(sentinelWorkspaceName)"
                echo "Daily Quota: ${{ parameters.dailyQuota }} GB"
                echo "Retention: ${{ parameters.retentionInDays }} days (interactive), ${{ parameters.totalRetentionInDays }} days (total)"

                # Build base Bicep parameters
                PARAMS="rgLocation=$(sentinelRegion) rgName=$(sentinelResourceGroup) lawName=$(sentinelWorkspaceName) dailyQuota=${{ parameters.dailyQuota }} retentionInDays=${{ parameters.retentionInDays }} totalRetentionInDays=${{ parameters.totalRetentionInDays }}"

                # Add optional playbook RG if set and different from Sentinel RG.
                # It arrives through env: an unset variable reaches the step as
                # the literal macro text, which is treated as empty.
                PLAYBOOK_RG="${PLAYBOOK_RESOURCE_GROUP:-}"
                if [[ "$PLAYBOOK_RG" == \$\(* ]]; then PLAYBOOK_RG=""; fi
                if [ -n "$PLAYBOOK_RG" ] && [ "$PLAYBOOK_RG" != "$(sentinelResourceGroup)" ]; then
                  echo "Including playbook resource group: $PLAYBOOK_RG"
                  PARAMS="$PARAMS playbookRgName=$PLAYBOOK_RG"
                fi

                # The check says whether the template's Sentinel module must run
                # (deploying the onboarding state twice returns Conflict).
                case "${DEPLOY_SENTINEL:-}" in
                  true|false)
                    echo "Deploy Sentinel: $DEPLOY_SENTINEL"
                    PARAMS="$PARAMS deploySentinel=$DEPLOY_SENTINEL"
                    ;;
                esac

                az deployment sub create \
                  --location "$(sentinelRegion)" \
                  --template-file Infra/sentinel/main.bicep \
                  --parameters $PARAMS
            env:
              PLAYBOOK_RESOURCE_GROUP: $(playbookResourceGroup)
              DEPLOY_SENTINEL: $(deploySentinel)

          - task: PowerShell@2
            displayName: "Wait for Workspace Indexing"
            inputs:
              targetType: "inline"
              pwsh: true
              script: |
                Write-Host "##[section]Waiting 60 seconds for Log Analytics workspace to become queryable..."
                Start-Sleep -Seconds 60
                Write-Host "Done."

  # =================================================================================
  # Workspace settings
  # The settings in Content/WorkspaceSettings/ deploy in a stage of their own,
  # after the infrastructure and before the Content Hub solutions, on every
  # run. No stage's condition reads this one, so a failed setting holds back
  # nothing.
  # =================================================================================
  - stage: DeployWorkspaceSettings
    displayName: "Deploy Workspace Settings"
    dependsOn:
      - CheckInfrastructure
      - DeployInfrastructure
    condition: |
      or(
        eq('${{ parameters.deployInfrastructure }}', 'False'),
        in(dependencies.DeployInfrastructure.result, 'Succeeded', 'Skipped')
      )
    jobs:
      - job: DeploySettings
        displayName: "Deploy Workspace Settings"
        pool:
          vmImage: "ubuntu-latest"
        timeoutInMinutes: 15
        steps:
          - checkout: self

          - task: PowerShell@2
            displayName: "Install powershell-yaml Module"
            inputs:
              targetType: "inline"
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'
                $haveYaml = Get-Module -ListAvailable -Name powershell-yaml |
                    Where-Object { $_.Version -eq [version]'$(yamlVersion)' }
                if (-not $haveYaml) {
                    Install-Module -Name powershell-yaml `
                        -RequiredVersion '$(yamlVersion)' `
                        -Force -Scope CurrentUser -AllowClobber
                }

          - task: AzurePowerShell@5
            displayName: "Deploy Workspace Settings"
            target:
              commands: restricted
              settableVariables: none
            inputs:
              azureSubscription: $(serviceConnection)
              ScriptType: "InlineScript"
              azurePowerShellVersion: "LatestVersion"
              pwsh: true
              Inline: |
                $ErrorActionPreference = 'Stop'
                $repo = $env:BUILD_SOURCESDIRECTORY
                Import-Module (Join-Path $repo 'Modules/iSOCDeployments/iSOCDeployments.psd1') -Force
                # An unset variable reaches the step as its own macro text.
                $playbookGroup = if ($env:PLAYBOOK_RESOURCE_GROUP -like '$(*') { '' } else { $env:PLAYBOOK_RESOURCE_GROUP }
                $connect = @{ SubscriptionId = $env:SENTINEL_SUBSCRIPTION_ID; ResourceGroup = $env:SENTINEL_RESOURCE_GROUP; WorkspaceName = $env:SENTINEL_WORKSPACE_NAME }
                if ($playbookGroup) { $connect['PlaybookResourceGroup'] = $playbookGroup }
                $null = Connect-iSOCWorkspace @connect
                $stage = @{ Stage = 'WorkspaceSettings'; RepoPath = $repo }
                if ('${{ parameters.whatIf }}' -eq 'True') { $stage['WhatIf'] = $true }
                $run = Deploy-iSOCWorkspace @stage
                exit $run.ExitCode
            env:
              SENTINEL_SUBSCRIPTION_ID: $(azureSubscriptionId)
              SENTINEL_RESOURCE_GROUP: $(sentinelResourceGroup)
              SENTINEL_WORKSPACE_NAME: $(sentinelWorkspaceName)
              PLAYBOOK_RESOURCE_GROUP: $(playbookResourceGroup)

  # =================================================================================
  # Stage 3: Deploy Content Hub
  # Deploys Content Hub solutions and their associated content. Runs regardless of
  # whether infrastructure was deployed or already existed.
  # =================================================================================
  - stage: DeployContentHub
    displayName: "Deploy Sentinel Content Hub"
    dependsOn:
      - CheckInfrastructure
      - DeployInfrastructure
      - DeployWorkspaceSettings
    condition: |
      and(
        eq('${{ parameters.deployContentHub }}', 'True'),
        or(
          eq('${{ parameters.deployInfrastructure }}', 'False'),
          in(dependencies.DeployInfrastructure.result, 'Succeeded', 'Skipped')
        )
      )
    jobs:
      - job: DeployContent
        displayName: "Deploy Solutions and Content"
        pool:
          vmImage: "ubuntu-latest"
        timeoutInMinutes: 120
        steps:
          - checkout: self

          - task: AzurePowerShell@5
            displayName: "Deploy Content Hub Solutions"
            target:
              commands: restricted
              settableVariables: none
            inputs:
              azureSubscription: $(serviceConnection)
              ScriptType: "InlineScript"
              azurePowerShellVersion: "LatestVersion"
              pwsh: true
              Inline: |
                $ErrorActionPreference = 'Stop'
                $repo = $env:BUILD_SOURCESDIRECTORY
                Import-Module (Join-Path $repo 'Modules/iSOCDeployments/iSOCDeployments.psd1') -Force
                # An unset variable reaches the step as its own macro text.
                $playbookGroup = if ($env:PLAYBOOK_RESOURCE_GROUP -like '$(*') { '' } else { $env:PLAYBOOK_RESOURCE_GROUP }
                $connect = @{ SubscriptionId = $env:SENTINEL_SUBSCRIPTION_ID; ResourceGroup = $env:SENTINEL_RESOURCE_GROUP; WorkspaceName = $env:SENTINEL_WORKSPACE_NAME }
                if ($playbookGroup) { $connect['PlaybookResourceGroup'] = $playbookGroup }
                $null = Connect-iSOCWorkspace @connect
                $stage = @{
                    Stage    = 'ContentHub'
                    RepoPath = $repo
                    Solution = @($env:CONTENT_HUB_SOLUTIONS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
                    Severity = @($env:CONTENT_HUB_SEVERITIES -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
                }
                if ('${{ parameters.disableRules }}' -eq 'True') { $stage['DisableRules'] = $true }
                if ('${{ parameters.protectCustomisedRules }}' -ne 'True') { $stage['OverwriteCustomisedRules'] = $true }
                $leftOut = @()
                if ('${{ parameters.skipAnalyticsRules }}' -eq 'True') { $leftOut += 'AnalyticsRule' }
                if ('${{ parameters.skipWorkbooks }}' -eq 'True') { $leftOut += 'Workbook' }
                if ('${{ parameters.skipAutomationRules }}' -eq 'True') { $leftOut += 'AutomationRule' }
                if ('${{ parameters.skipHuntingQueries }}' -eq 'True') { $leftOut += 'HuntingQuery' }
                if ($leftOut) { $stage['ExcludeSolutionContentType'] = $leftOut }
                if ('${{ parameters.forceSolutionUpdate }}' -eq 'True') { $stage['ForceSolutionUpdate'] = $true }
                if ('${{ parameters.forceContentDeployment }}' -eq 'True') { $stage['ForceContentDeployment'] = $true }
                if ('${{ parameters.whatIf }}' -eq 'True') { $stage['WhatIf'] = $true }
                $run = Deploy-iSOCWorkspace @stage
                exit $run.ExitCode
            env:
              SENTINEL_SUBSCRIPTION_ID: $(azureSubscriptionId)
              SENTINEL_RESOURCE_GROUP: $(sentinelResourceGroup)
              SENTINEL_WORKSPACE_NAME: $(sentinelWorkspaceName)
              PLAYBOOK_RESOURCE_GROUP: $(playbookResourceGroup)
              CONTENT_HUB_SOLUTIONS: ${{ parameters.solutions }}
              CONTENT_HUB_SEVERITIES: ${{ parameters.severitiesToInclude }}

  # =================================================================================
  # Stage 4: Deploy Custom Content
  # Deploys custom Parsers (YAML), AnalyticalRules (YAML), Watchlists (JSON+CSV),
  # Playbooks (ARM), Workbooks (gallery JSON), Hunting Queries (YAML),
  # Automation Rules (JSON), and Summary Rules (JSON) from the repo to the
  # Sentinel workspace. Uses dependencies.json for prerequisite validation.
  # =================================================================================
  - stage: DeployCustomContent
    displayName: "Deploy Custom Content"
    dependsOn:
      - CheckInfrastructure
      - DeployInfrastructure
      - DeployContentHub
    condition: |
      and(
        eq('${{ parameters.deployCustomContent }}', 'True'),
        or(
          eq('${{ parameters.deployInfrastructure }}', 'False'),
          in(dependencies.DeployContentHub.result, 'Succeeded', 'Skipped')
        )
      )
    jobs:
      - job: DeployCustom
        displayName: "Deploy Custom Sentinel Content"
        pool:
          vmImage: "ubuntu-latest"
        timeoutInMinutes: 60
        steps:
          - checkout: self
            fetchDepth: 2   # Smart deployment needs parent commit for git diff

          - task: DownloadPipelineArtifact@2
            displayName: "Restore Deployment State"
            condition: succeeded()
            continueOnError: true
            inputs:
              buildType: "specific"
              project: "$(System.TeamProjectId)"
              definition: "$(System.DefinitionId)"
              buildVersionToDownload: "latestFromBranch"
              branchName: "$(Build.SourceBranch)"
              allowPartiallySucceededBuilds: true
              allowFailedBuilds: true
              artifactName: "deployment-state"
              targetPath: "$(Build.SourcesDirectory)"

          - task: PowerShell@2
            displayName: "Install powershell-yaml Module"
            inputs:
              targetType: "inline"
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'
                Write-Host "##[section]Installing powershell-yaml $(yamlVersion)"
                $haveYaml = Get-Module -ListAvailable -Name powershell-yaml |
                    Where-Object { $_.Version -eq [version]'$(yamlVersion)' }
                if (-not $haveYaml) {
                    Install-Module -Name powershell-yaml `
                        -RequiredVersion '$(yamlVersion)' `
                        -Force -Scope CurrentUser -AllowClobber
                }
                Get-Module -ListAvailable powershell-yaml |
                    Where-Object { $_.Version -eq [version]'$(yamlVersion)' } |
                    Format-Table Name, Version

          # Deploy-iSOCWorkspace checks dependencies.json against what
          # discovery produces from current content before it deploys. The
          # PR-validation gate already checks this on every PR to main, but a
          # scheduled deploy could still race a non-deploy commit that
          # bypassed the gate, so a stale manifest fails the stage.
          - task: AzurePowerShell@5
            displayName: "Deploy Custom Content"
            target:
              commands: restricted
              settableVariables: none
            inputs:
              azureSubscription: $(serviceConnection)
              ScriptType: "InlineScript"
              azurePowerShellVersion: "LatestVersion"
              pwsh: true
              Inline: |
                $ErrorActionPreference = 'Stop'
                $repo = $env:BUILD_SOURCESDIRECTORY
                Import-Module (Join-Path $repo 'Modules/iSOCDeployments/iSOCDeployments.psd1') -Force
                # An unset variable reaches the step as its own macro text.
                $playbookGroup = if ($env:PLAYBOOK_RESOURCE_GROUP -like '$(*') { '' } else { $env:PLAYBOOK_RESOURCE_GROUP }
                $connect = @{ SubscriptionId = $env:SENTINEL_SUBSCRIPTION_ID; ResourceGroup = $env:SENTINEL_RESOURCE_GROUP; WorkspaceName = $env:SENTINEL_WORKSPACE_NAME }
                if ($playbookGroup) { $connect['PlaybookResourceGroup'] = $playbookGroup }
                $null = Connect-iSOCWorkspace @connect
                # The command checks dependencies.json first and refuses a stale one.
                $stage = @{ Stage = 'CustomContent'; RepoPath = $repo }
                $leftOut = @()
                if ('${{ parameters.skipCustomParsers }}' -eq 'True') { $leftOut += 'Parser' }
                if ('${{ parameters.skipCustomDetections }}' -eq 'True') { $leftOut += 'AnalyticsRule' }
                if ('${{ parameters.skipCustomWatchlists }}' -eq 'True') { $leftOut += 'Watchlist' }
                if ('${{ parameters.skipCustomPlaybooks }}' -eq 'True') { $leftOut += 'Playbook' }
                if ('${{ parameters.skipCustomWorkbooks }}' -eq 'True') { $leftOut += 'Workbook' }
                if ('${{ parameters.skipCustomHuntingQueries }}' -eq 'True') { $leftOut += 'HuntingQuery' }
                if ('${{ parameters.skipCustomAutomationRules }}' -eq 'True') { $leftOut += 'AutomationRule' }
                if ('${{ parameters.skipCustomSummaryRules }}' -eq 'True') { $leftOut += 'SummaryRule' }
                if ($leftOut) { $stage['ExcludeContentType'] = $leftOut }
                if ('${{ parameters.skipCommunityDetections }}' -eq 'True') { $stage['Exclude'] = 'Content/AnalyticalRules/Community/*' }
                if ('${{ parameters.smartDeployment }}' -eq 'True') { $stage['SmartDeployment'] = $true }
                if ('${{ parameters.whatIf }}' -eq 'True') { $stage['WhatIf'] = $true }
                $run = Deploy-iSOCWorkspace @stage
                exit $run.ExitCode
            env:
              SENTINEL_SUBSCRIPTION_ID: $(azureSubscriptionId)
              SENTINEL_RESOURCE_GROUP: $(sentinelResourceGroup)
              SENTINEL_WORKSPACE_NAME: $(sentinelWorkspaceName)
              PLAYBOOK_RESOURCE_GROUP: $(playbookResourceGroup)

          - task: PublishPipelineArtifact@1
            displayName: "Save Deployment State"
            condition: always()
            continueOnError: true
            inputs:
              targetPath: "$(Build.SourcesDirectory)/deployment-state.json"
              artifactName: "deployment-state"

  # =================================================================================
  # Stage 5: Deploy Defender XDR Custom Detections
  # Deploys custom detection rules to the Microsoft Defender XDR platform via the
  # Microsoft Graph Security API. Rules are defined as YAML files in Content/DefenderCustomDetections/.
  # Requires CustomDetection.ReadWrite.All Graph application permission.
  # =================================================================================
  - stage: DeployDefenderDetections
    displayName: "Deploy Defender XDR Custom Detections"
    dependsOn:
      - CheckInfrastructure
      - DeployInfrastructure
      - DeployContentHub
      - DeployCustomContent
    condition: |
      and(
        eq('${{ parameters.deployDefenderDetections }}', 'True'),
        or(
          eq('${{ parameters.deployCustomContent }}', 'False'),
          in(dependencies.DeployCustomContent.result, 'Succeeded', 'Skipped')
        )
      )
    jobs:
      - job: DeployDefenderRules
        displayName: "Deploy Custom Detection Rules to Defender XDR"
        pool:
          vmImage: "ubuntu-latest"
        timeoutInMinutes: 30
        steps:
          - checkout: self

          - task: PowerShell@2
            displayName: "Install powershell-yaml Module"
            inputs:
              targetType: "inline"
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'
                Write-Host "##[section]Installing powershell-yaml $(yamlVersion)"
                $haveYaml = Get-Module -ListAvailable -Name powershell-yaml |
                    Where-Object { $_.Version -eq [version]'$(yamlVersion)' }
                if (-not $haveYaml) {
                    Install-Module -Name powershell-yaml `
                        -RequiredVersion '$(yamlVersion)' `
                        -Force -Scope CurrentUser -AllowClobber
                }
                Get-Module -ListAvailable powershell-yaml |
                    Where-Object { $_.Version -eq [version]'$(yamlVersion)' } |
                    Format-Table Name, Version

          - task: AzurePowerShell@5
            displayName: "Deploy Defender Custom Detections"
            target:
              commands: restricted
              settableVariables: none
            inputs:
              azureSubscription: $(serviceConnection)
              ScriptType: "InlineScript"
              azurePowerShellVersion: "LatestVersion"
              pwsh: true
              Inline: |
                $ErrorActionPreference = 'Stop'
                $repo = $env:BUILD_SOURCESDIRECTORY
                Import-Module (Join-Path $repo 'Modules/iSOCDeployments/iSOCDeployments.psd1') -Force
                # An unset variable reaches the step as its own macro text.
                $playbookGroup = if ($env:PLAYBOOK_RESOURCE_GROUP -like '$(*') { '' } else { $env:PLAYBOOK_RESOURCE_GROUP }
                $connect = @{ SubscriptionId = $env:SENTINEL_SUBSCRIPTION_ID; ResourceGroup = $env:SENTINEL_RESOURCE_GROUP; WorkspaceName = $env:SENTINEL_WORKSPACE_NAME }
                if ($playbookGroup) { $connect['PlaybookResourceGroup'] = $playbookGroup }
                $null = Connect-iSOCWorkspace @connect
                $stage = @{ Stage = 'DefenderDetections'; RepoPath = $repo }
                if ('${{ parameters.whatIf }}' -eq 'True') { $stage['WhatIf'] = $true }
                $run = Deploy-iSOCWorkspace @stage
                exit $run.ExitCode
            env:
              SENTINEL_SUBSCRIPTION_ID: $(azureSubscriptionId)
              SENTINEL_RESOURCE_GROUP: $(sentinelResourceGroup)
              SENTINEL_WORKSPACE_NAME: $(sentinelWorkspaceName)
              PLAYBOOK_RESOURCE_GROUP: $(playbookResourceGroup)
