name: Update Solution Mapping

# Refreshes Tools/ClassicToDcr/data/solution-mapping.json (used by
# Invoke-TableMigrationReview.ps1) from the upstream Azure-Sentinel Solutions
# Analyzer. Follows the repo's bot pattern: never push to main directly; push
# a rolling auto/* branch and open or refresh a PR so branch protection and
# the required status checks still run.

on:
  schedule:
    - cron: '0 6 * * 1'   # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write        # push the rolling auto-sync branch
  pull-requests: write   # gh pr create / edit

env:
  SYNC_BRANCH:   "auto/solution-mapping-sync"
  TARGET_BRANCH: "main"
  MAPPING:       "Tools/ClassicToDcr/data/solution-mapping.json"

jobs:
  update-mapping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Regenerate solution mapping
        run: node Tools/ClassicToDcr/data/update-solution-mapping.mjs

      - name: Detect change
        id: diff
        run: |
          if git diff --quiet -- "$MAPPING"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push auto-sync branch and open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Move the regenerated mapping onto the rolling bot branch. It is
          # never hand-edited, so a force-push is safe.
          git checkout -B "$SYNC_BRANCH"
          git add "$MAPPING"
          git commit -m "chore(data): refresh ClassicToDcr solution-mapping.json from upstream"
          git push --force-with-lease origin "$SYNC_BRANCH"

          EXISTING_PR=$(gh pr list --head "$SYNC_BRANCH" --base "$TARGET_BRANCH" \
                          --state open --json number --jq '.[0].number' || true)

          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "PR #$EXISTING_PR refreshed by the branch push."
          else
            gh pr create \
              --head "$SYNC_BRANCH" \
              --base "$TARGET_BRANCH" \
              --title "chore(data): refresh ClassicToDcr solution-mapping.json" \
              --body "Automated weekly refresh of \`Tools/ClassicToDcr/data/solution-mapping.json\` from the upstream Azure-Sentinel Solutions Analyzer, generated by \`.github/workflows/update-solution-mapping.yml\`."
          fi
