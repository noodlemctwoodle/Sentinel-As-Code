# ---------------------------------------------------------------------------
# GitHub Actions Workflow: Deploy Microsoft Sentinel Infrastructure & Content
# ---------------------------------------------------------------------------
# Equivalent of Pipelines/Sentinel-Deploy.yml for GitHub-hosted repos.
#
# Every job runs the iSOCDeployments module (Modules/iSOCDeployments):
# Get-iSOCWorkspaceOnboarding for the check, and Deploy-iSOCWorkspace -Stage
# for the workspace settings, Content Hub, custom content and Defender XDR
# stages. Registering providers, Bicep, the waits and the deployment state
# stay workflow steps.
#
# Prerequisites:
#   - Azure Service Principal with Contributor + Microsoft Sentinel Contributor
#   - Federated credentials (OIDC) configured for this repo
#   - CustomDetection.ReadWrite.All Graph permission for Stage 5
#
# Required secrets:
#   AZURE_CLIENT_ID        - Service Principal Application (client) ID
#   AZURE_TENANT_ID        - Entra ID Tenant ID
#   AZURE_SUBSCRIPTION_ID  - Azure Subscription ID
#
# Required variables (Settings > Secrets and variables > Variables):
#   SENTINEL_RESOURCE_GROUP   - Resource Group name
#   SENTINEL_WORKSPACE_NAME   - Log Analytics workspace name
#   SENTINEL_REGION           - Azure region (e.g., uksouth)
#   PLAYBOOK_RESOURCE_GROUP   - (Optional) Resource Group for playbooks, defaults to SENTINEL_RESOURCE_GROUP
#
# Authentication: Uses OIDC (federated credentials) by default.
# ---------------------------------------------------------------------------

name: Deploy Sentinel

on:
  workflow_dispatch:
    inputs:
      # ── Stage Toggles ────────────────────────────────────────────────
      deploy_infrastructure:
        description: "Stage 1-2: Deploy Infrastructure (Bicep)"
        type: boolean
        default: true
      deploy_content_hub:
        description: "Stage 3: Deploy Content Hub Solutions"
        type: boolean
        default: true
      deploy_custom_content:
        description: "Stage 4: Deploy Custom Content"
        type: boolean
        default: true
      deploy_defender_detections:
        description: "Stage 5: Deploy Defender XDR Custom Detections"
        type: boolean
        default: true

      # ── Infrastructure (Stage 2) ─────────────────────────────────────
      daily_quota:
        description: "Bicep: Daily Quota (GB, 0 = unlimited)"
        type: number
        default: 0
      retention_in_days:
        description: "Bicep: Interactive Retention (days, 30-730)"
        type: number
        default: 90
      total_retention_in_days:
        description: "Bicep: Total Retention incl. Archive (0 = same as interactive)"
        type: number
        default: 0

      # ── Content Hub (Stage 3) ────────────────────────────────────────
      solutions:
        description: "Content Hub: Solutions (comma-separated)"
        type: string
        default: "Analytics Health & Audit,Azure Activity,Azure DevOps Auditing,Azure Key Vault,Azure Logic Apps,Azure Network Security Groups,Azure Resource Graph,Azure Storage,Common Event Format,Data Collection Rule Toolkit,Microsoft 365,Microsoft Defender for Cloud,Microsoft Defender for Cloud Apps,Microsoft Defender for Endpoint,Microsoft Defender for Identity,Microsoft Defender Threat Intelligence,Microsoft Defender XDR,Microsoft Entra ID,Microsoft Sentinel Optimization Workbook,SOC Handbook,Summary Rules Workbook,Syslog,Threat Intelligence (NEW),Windows Security Events,Windows Server DNS,Workspace Usage Report"
      severities_to_include:
        description: "Content Hub: Analytics Rule Severities"
        type: string
        default: "High,Medium,Low,Informational"
      disable_rules:
        description: "Content Hub: Deploy Analytics Rules as Disabled"
        type: boolean
        default: true
      protect_customised_rules:
        description: "Content Hub: Protect Customised Rules"
        type: boolean
        default: true
      skip_analytics_rules:
        description: "Content Hub: Skip Analytics Rules"
        type: boolean
        default: false
      skip_workbooks:
        description: "Content Hub: Skip Workbooks"
        type: boolean
        default: false
      skip_automation_rules:
        description: "Content Hub: Skip Automation Rules"
        type: boolean
        default: false
      skip_hunting_queries:
        description: "Content Hub: Skip Hunting Queries"
        type: boolean
        default: false
      force_solution_update:
        description: "Content Hub: Force Solution Update (even if current)"
        type: boolean
        default: false
      force_content_deployment:
        description: "Content Hub: Force Content Redeployment (even if current)"
        type: boolean
        default: false

      # ── Custom Content (Stage 4) ─────────────────────────────────────
      # GitHub caps workflow_dispatch at 25 inputs. The ADO equivalent in
      # Pipelines/Sentinel-Deploy.yml exposes nine separate skipCustom*
      # boolean parameters here; we collapse them into one comma-separated
      # string so the GH workflow stays under the cap while preserving
      # identical downstream behaviour (Deploy-iSOCWorkspace receives them
      # as -ExcludeContentType and -Exclude, from the parsing block in
      # the deploy-custom-content job below).
      skip_custom_content_types:
        description: "Custom: Skip Content Types (comma-separated subset of: parsers, detections, community-detections, watchlists, playbooks, workbooks, hunting-queries, automation-rules, summary-rules)"
        type: string
        default: "community-detections"

      # ── General ──────────────────────────────────────────────────────
      smart_deployment:
        description: "Smart Deploy: only deploy changed/failed content"
        type: boolean
        default: true
      what_if:
        description: "Dry Run: preview changes without applying"
        type: boolean
        default: false

  schedule:
    - cron: "0 4 * * 1"  # Weekly Monday 04:00 UTC

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: ${{ vars.SENTINEL_RESOURCE_GROUP }}
  WORKSPACE_NAME: ${{ vars.SENTINEL_WORKSPACE_NAME }}
  REGION:         ${{ vars.SENTINEL_REGION }}

  # Pin powershell-yaml so a PSGallery release that tightens parser
  # behaviour cannot break a scheduled deploy. Bumping is a one-line PR
  # that re-runs the gate against the new version before merging.
  YAML_VERSION:   "0.4.12"

jobs:
  # ===========================================================================
  # Stage 1: Check Existing Infrastructure
  # ===========================================================================
  check-infrastructure:
    name: "Check Existing Infrastructure"
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy_infrastructure != false }}
    outputs:
      bicep_needed:    ${{ steps.check.outputs.bicep_needed }}
      deploy_sentinel: ${{ steps.check.outputs.deploy_sentinel }}
    steps:
      # Required even though this job reads no repo files: the
      # Azure-login composite below lives under .github/actions/ in
      # this repo, and local composite actions can only be resolved
      # once the runner has the repo on disk.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure Login (OIDC)
        uses: ./.github/actions/azure-login-oidc
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check for Existing Resources
        id: check
        shell: pwsh
        env:
          AZURE_SUBSCRIPTION_ID:   ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          PLAYBOOK_RESOURCE_GROUP: ${{ vars.PLAYBOOK_RESOURCE_GROUP }}
        run: |
          # Get-iSOCWorkspaceOnboarding probes the resource group, the
          # workspace, both Sentinel onboarding resources and the optional
          # playbook resource group, and decides two things for Stage 2:
          #
          #   bicep_needed    - gate on whether to run Bicep at all
          #                     (true if ANY component is missing).
          #   deploy_sentinel - whether the Sentinel module should run
          #                     inside Bicep (false if Sentinel is already
          #                     onboarded), so main.bicep can provision
          #                     only a missing playbook RG without
          #                     re-creating the non-idempotent
          #                     onboardingStates resource, which returns
          #                     Conflict on re-deploy.
          #
          # The one state Bicep cannot repair (onboarding state present,
          # SecurityInsights solution gone) is logged as errors and returned
          # as ExitCode 1, which fails this job before Bicep runs.
          $ErrorActionPreference = 'Stop'
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'Modules/iSOCDeployments/iSOCDeployments.psd1') -Force
          # Trim accidental whitespace in the repo variable.
          $playbookGroup = "$env:PLAYBOOK_RESOURCE_GROUP".Trim()
          $onboarding = Get-iSOCWorkspaceOnboarding `
              -SubscriptionId        $env:AZURE_SUBSCRIPTION_ID `
              -ResourceGroup         $env:RESOURCE_GROUP `
              -WorkspaceName         $env:WORKSPACE_NAME `
              -PlaybookResourceGroup $playbookGroup

          "bicep_needed=$($onboarding.InfrastructureNeeded.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "deploy_sentinel=$($onboarding.DeploySentinel.ToString().ToLower())"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit $onboarding.ExitCode

  # ===========================================================================
  # Stage 2: Deploy Infrastructure (Bicep)
  # ===========================================================================
  deploy-infrastructure:
    name: "Deploy Sentinel Infrastructure (Bicep)"
    runs-on: ubuntu-latest
    needs: check-infrastructure
    if: |
      always() &&
      needs.check-infrastructure.result == 'success' &&
      needs.check-infrastructure.outputs.bicep_needed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure Login (OIDC)
        uses: ./.github/actions/azure-login-oidc
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Register Resource Providers
        uses: Azure/cli@v3
        with:
          inlineScript: |
            az provider register --namespace Microsoft.OperationsManagement --wait
            az provider register --namespace Microsoft.SecurityInsights --wait

      - name: Deploy Bicep Templates
        uses: Azure/cli@v3
        with:
          inlineScript: |
            # Strip ALL whitespace (space, tab, CR, LF, FF, VT) from
            # the optional PLAYBOOK_RESOURCE_GROUP repo variable. Azure
            # RG names cannot contain any whitespace, so destructive
            # stripping is safe and matches the intent.
            #
            # `tr -d '[:space:]'` replaces the earlier `xargs` approach
            # because the Azure CLI runner image
            # (mcr.microsoft.com/azure-cli) is Alpine-based and ships
            # BusyBox xargs, which — unlike GNU xargs — does NOT treat
            # CR ('\r') as whitespace. A GH repo variable accidentally
            # carrying CRLF line endings then leaked a trailing '\r'
            # into the ARM call:
            #   InvalidResourceGroup: 'rg-name\r' has these invalid
            #   characters: '\r'.
            # `tr -d '[:space:]'` is POSIX-portable and strips every
            # whitespace class on every shell environment we target.
            #
            # Empty input stays empty, which Infra/sentinel/main.bicep:55 treats
            # as "no separate playbook RG required" (the conditional
            # playbookRg resource only fires when playbookRgName is
            # non-empty and != rgName).
            PLAYBOOK_RG=$(printf '%s' "${{ vars.PLAYBOOK_RESOURCE_GROUP }}" | tr -d '[:space:]')

            az deployment sub create \
              --location "${{ env.REGION }}" \
              --template-file Infra/sentinel/main.bicep \
              --parameters \
                rgLocation="${{ env.REGION }}" \
                rgName="${{ env.RESOURCE_GROUP }}" \
                lawName="${{ env.WORKSPACE_NAME }}" \
                dailyQuota=${{ inputs.daily_quota || 0 }} \
                retentionInDays=${{ inputs.retention_in_days || 90 }} \
                totalRetentionInDays=${{ inputs.total_retention_in_days || 0 }} \
                playbookRgName="$PLAYBOOK_RG" \
                deploySentinel=${{ needs.check-infrastructure.outputs.deploy_sentinel }}

      - name: Wait for Workspace Indexing
        shell: pwsh
        run: |
          Write-Host "Waiting 60 seconds for Log Analytics workspace to become queryable..."
          Start-Sleep -Seconds 60
          Write-Host "Done."

  # ===========================================================================
  # Workspace settings
  # The settings in Content/WorkspaceSettings/ deploy in a job of their own,
  # after the infrastructure and before the Content Hub solutions, on every
  # run. No job's condition reads this one, so a failed setting holds back
  # nothing.
  # ===========================================================================
  deploy-workspace-settings:
    name: "Deploy Workspace Settings"
    runs-on: ubuntu-latest
    needs: [check-infrastructure, deploy-infrastructure]
    if: |
      always() &&
      (needs.deploy-infrastructure.result == 'success' || needs.deploy-infrastructure.result == 'skipped')
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure Login (OIDC)
        uses: ./.github/actions/azure-login-oidc
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up PowerShell modules (powershell-yaml only)
        uses: ./.github/actions/setup-pwsh-modules
        with:
          yaml-version:   ${{ env.YAML_VERSION }}
          install-pester: 'false'

      - name: Deploy Workspace Settings
        shell: pwsh
        env:
          AZURE_SUBSCRIPTION_ID:   ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          PLAYBOOK_RESOURCE_GROUP: ${{ vars.PLAYBOOK_RESOURCE_GROUP }}
          WHAT_IF:                 ${{ inputs.what_if }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_WORKSPACE
          Import-Module (Join-Path $repo 'Modules/iSOCDeployments/iSOCDeployments.psd1') -Force
          # Trim accidental whitespace in the repo variable; Azure treats
          # 'rg-name ' as a distinct (non-existent) resource group.
          $playbookGroup = "$env:PLAYBOOK_RESOURCE_GROUP".Trim()
          $connect = @{ SubscriptionId = $env:AZURE_SUBSCRIPTION_ID; ResourceGroup = $env:RESOURCE_GROUP; WorkspaceName = $env:WORKSPACE_NAME }
          if ($playbookGroup) { $connect['PlaybookResourceGroup'] = $playbookGroup }
          $null = Connect-iSOCWorkspace @connect
          $stage = @{ Stage = 'WorkspaceSettings'; RepoPath = $repo }
          if ($env:WHAT_IF -eq 'true') { $stage['WhatIf'] = $true }
          $run = Deploy-iSOCWorkspace @stage
          exit $run.ExitCode

  # ===========================================================================
  # Stage 3: Deploy Content Hub
  # ===========================================================================
  deploy-content-hub:
    name: "Deploy Sentinel Content Hub"
    runs-on: ubuntu-latest
    needs: [check-infrastructure, deploy-infrastructure, deploy-workspace-settings]
    if: |
      always() &&
      (inputs.deploy_content_hub != false) &&
      (needs.deploy-infrastructure.result == 'success' || needs.deploy-infrastructure.result == 'skipped')
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure Login (OIDC)
        uses: ./.github/actions/azure-login-oidc
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Content Hub Solutions
        shell: pwsh
        env:
          AZURE_SUBSCRIPTION_ID:    ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          PLAYBOOK_RESOURCE_GROUP:  ${{ vars.PLAYBOOK_RESOURCE_GROUP }}
          CONTENT_HUB_SOLUTIONS:    "${{ inputs.solutions || 'Analytics Health & Audit,Azure Activity,Azure DevOps Auditing,Azure Key Vault,Azure Logic Apps,Azure Network Security Groups,Azure Resource Graph,Azure Storage,Common Event Format,Data Collection Rule Toolkit,Microsoft 365,Microsoft Defender for Cloud,Microsoft Defender for Cloud Apps,Microsoft Defender for Endpoint,Microsoft Defender for Identity,Microsoft Defender Threat Intelligence,Microsoft Defender XDR,Microsoft Entra ID,Microsoft Sentinel Optimization Workbook,SOC Handbook,Summary Rules Workbook,Syslog,Threat Intelligence (NEW),Windows Security Events,Windows Server DNS,Workspace Usage Report' }}"
          CONTENT_HUB_SEVERITIES:   ${{ inputs.severities_to_include || 'High,Medium,Low,Informational' }}
          DISABLE_RULES:            ${{ inputs.disable_rules }}
          PROTECT_CUSTOMISED_RULES: ${{ inputs.protect_customised_rules }}
          SKIP_ANALYTICS_RULES:     ${{ inputs.skip_analytics_rules }}
          SKIP_WORKBOOKS:           ${{ inputs.skip_workbooks }}
          SKIP_AUTOMATION_RULES:    ${{ inputs.skip_automation_rules }}
          SKIP_HUNTING_QUERIES:     ${{ inputs.skip_hunting_queries }}
          FORCE_SOLUTION_UPDATE:    ${{ inputs.force_solution_update }}
          FORCE_CONTENT_DEPLOYMENT: ${{ inputs.force_content_deployment }}
          WHAT_IF:                  ${{ inputs.what_if }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_WORKSPACE
          Import-Module (Join-Path $repo 'Modules/iSOCDeployments/iSOCDeployments.psd1') -Force
          # Trim accidental whitespace in the repo variable; Azure treats
          # 'rg-name ' as a distinct (non-existent) resource group.
          $playbookGroup = "$env:PLAYBOOK_RESOURCE_GROUP".Trim()
          $connect = @{ SubscriptionId = $env:AZURE_SUBSCRIPTION_ID; ResourceGroup = $env:RESOURCE_GROUP; WorkspaceName = $env:WORKSPACE_NAME }
          if ($playbookGroup) { $connect['PlaybookResourceGroup'] = $playbookGroup }
          $null = Connect-iSOCWorkspace @connect
          $stage = @{
              Stage    = 'ContentHub'
              RepoPath = $repo
              Solution = @($env:CONTENT_HUB_SOLUTIONS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
              Severity = @($env:CONTENT_HUB_SEVERITIES -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          }
          # A scheduled run has no inputs: rules deploy disabled and customised
          # rules stay protected, the workflow_dispatch defaults.
          if ($env:DISABLE_RULES -ne 'false') { $stage['DisableRules'] = $true }
          if ($env:PROTECT_CUSTOMISED_RULES -eq 'false') { $stage['OverwriteCustomisedRules'] = $true }
          $leftOut = @()
          if ($env:SKIP_ANALYTICS_RULES -eq 'true') { $leftOut += 'AnalyticsRule' }
          if ($env:SKIP_WORKBOOKS -eq 'true') { $leftOut += 'Workbook' }
          if ($env:SKIP_AUTOMATION_RULES -eq 'true') { $leftOut += 'AutomationRule' }
          if ($env:SKIP_HUNTING_QUERIES -eq 'true') { $leftOut += 'HuntingQuery' }
          if ($leftOut) { $stage['ExcludeSolutionContentType'] = $leftOut }
          if ($env:FORCE_SOLUTION_UPDATE -eq 'true') { $stage['ForceSolutionUpdate'] = $true }
          if ($env:FORCE_CONTENT_DEPLOYMENT -eq 'true') { $stage['ForceContentDeployment'] = $true }
          if ($env:WHAT_IF -eq 'true') { $stage['WhatIf'] = $true }
          $run = Deploy-iSOCWorkspace @stage
          exit $run.ExitCode

  # ===========================================================================
  # Stage 4: Deploy Custom Content
  # ===========================================================================
  deploy-custom-content:
    name: "Deploy Custom Content"
    runs-on: ubuntu-latest
    needs: [check-infrastructure, deploy-infrastructure, deploy-content-hub]
    if: |
      always() &&
      (inputs.deploy_custom_content != false) &&
      (needs.deploy-content-hub.result == 'success' || needs.deploy-content-hub.result == 'skipped')
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2   # Smart deployment needs parent commit for git diff

      - name: Restore Deployment State
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/deployment-state.json
          key: deployment-state-${{ env.WORKSPACE_NAME }}-
          restore-keys: |
            deployment-state-${{ env.WORKSPACE_NAME }}-

      - name: Set up PowerShell modules (powershell-yaml only)
        uses: ./.github/actions/setup-pwsh-modules
        with:
          yaml-version:   ${{ env.YAML_VERSION }}
          install-pester: 'false'

      # Bicep playbooks are compiled with the standalone Bicep CLI, which
      # the iSOCDeployments module (and Az.Resources, deploying them)
      # needs on the PATH. Use the one already on the runner; when there
      # is none, install it with the Azure CLI and put it on the PATH.
      - name: Put the Bicep CLI on the PATH
        shell: bash
        run: |
          set -euo pipefail
          if command -v bicep > /dev/null 2>&1; then
              bicep --version
          else
              az bicep install
              echo "$HOME/.azure/bin" >> "$GITHUB_PATH"
              "$HOME/.azure/bin/bicep" --version
          fi

      # Pre-deploy guard: dependencies.json must match what discovery
      # produces from current content. The PR-validation gate already
      # checks this on every PR to main, but a scheduled deploy from main
      # could still race if a non-deploy commit (e.g. a doc-only change
      # that bumps an analytical rule's query inline) bypassed the gate.
      # Failing fast here is cheap and prevents the deployer from running
      # against a stale dependency graph. Deploy-iSOCWorkspace repeats the
      # check before the custom content stage deploys.
      - name: Verify dependency manifest is current
        shell: pwsh
        run: |
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'Modules/iSOCDeployments/iSOCDeployments.psd1') -Force
          $result = Test-iSOCDependencyManifest -RepoPath $env:GITHUB_WORKSPACE
          if (-not $result.Exists -or $result.HasDrift) {
              Write-Host "::error::dependencies.json is out of sync. Refusing to deploy with a stale dependency graph."
              Write-Host "::error::Fix: run Update-iSOCDependencyManifest, commit, then re-run this workflow."
              exit 1
          }

      - name: Azure Login (OIDC)
        uses: ./.github/actions/azure-login-oidc
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Custom Content
        shell: pwsh
        env:
          AZURE_SUBSCRIPTION_ID:     ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          PLAYBOOK_RESOURCE_GROUP:   ${{ vars.PLAYBOOK_RESOURCE_GROUP }}
          SKIP_CUSTOM_CONTENT_TYPES: ${{ inputs.skip_custom_content_types || 'community-detections' }}
          SMART_DEPLOYMENT:          ${{ inputs.smart_deployment }}
          WHAT_IF:                   ${{ inputs.what_if }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_WORKSPACE
          Import-Module (Join-Path $repo 'Modules/iSOCDeployments/iSOCDeployments.psd1') -Force
          # Trim accidental whitespace in the repo variable; Azure treats
          # 'rg-name ' as a distinct (non-existent) resource group.
          $playbookGroup = "$env:PLAYBOOK_RESOURCE_GROUP".Trim()
          $connect = @{ SubscriptionId = $env:AZURE_SUBSCRIPTION_ID; ResourceGroup = $env:RESOURCE_GROUP; WorkspaceName = $env:WORKSPACE_NAME }
          if ($playbookGroup) { $connect['PlaybookResourceGroup'] = $playbookGroup }
          $null = Connect-iSOCWorkspace @connect

          # The command checks dependencies.json first and refuses a stale one.
          $stage = @{ Stage = 'CustomContent'; RepoPath = $repo }

          # Turn the consolidated skip_custom_content_types string into the
          # command's -ExcludeContentType and -Exclude. The cron trigger has
          # no inputs.*, so the `|| 'community-detections'` fallback matches
          # the workflow_dispatch default for parity. ADO's equivalent block
          # (Pipelines/Sentinel-Deploy.yml) sets the same parameters from its
          # nine individual boolean parameters.
          $skipList = @($env:SKIP_CUSTOM_CONTENT_TYPES -split ',' | ForEach-Object { $_.Trim().ToLower() } | Where-Object { $_ })
          $contentTypes = [ordered]@{
              'parsers'          = 'Parser'
              'detections'       = 'AnalyticsRule'
              'watchlists'       = 'Watchlist'
              'playbooks'        = 'Playbook'
              'workbooks'        = 'Workbook'
              'hunting-queries'  = 'HuntingQuery'
              'automation-rules' = 'AutomationRule'
              'summary-rules'    = 'SummaryRule'
          }
          $leftOut = @($contentTypes.Keys | Where-Object { $skipList -contains $_ } | ForEach-Object { $contentTypes[$_] })
          if ($leftOut) { $stage['ExcludeContentType'] = $leftOut }
          if ($skipList -contains 'community-detections') { $stage['Exclude'] = 'Content/AnalyticalRules/Community/*' }
          if ($env:SMART_DEPLOYMENT -ne 'false') { $stage['SmartDeployment'] = $true }
          if ($env:WHAT_IF -eq 'true') { $stage['WhatIf'] = $true }
          $run = Deploy-iSOCWorkspace @stage
          exit $run.ExitCode

      - name: Save Deployment State
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/deployment-state.json
          key: deployment-state-${{ env.WORKSPACE_NAME }}-${{ github.run_id }}

  # ===========================================================================
  # Stage 5: Deploy Defender XDR Custom Detections
  # ===========================================================================
  deploy-defender-detections:
    name: "Deploy Defender XDR Custom Detections"
    runs-on: ubuntu-latest
    needs: [check-infrastructure, deploy-infrastructure, deploy-content-hub, deploy-custom-content]
    if: |
      always() &&
      (inputs.deploy_defender_detections != false) &&
      (needs.deploy-custom-content.result == 'success' || needs.deploy-custom-content.result == 'skipped')
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure Login (OIDC)
        uses: ./.github/actions/azure-login-oidc
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up PowerShell modules (powershell-yaml only)
        uses: ./.github/actions/setup-pwsh-modules
        with:
          yaml-version:   ${{ env.YAML_VERSION }}
          install-pester: 'false'

      - name: Deploy Defender Custom Detections
        shell: pwsh
        env:
          AZURE_SUBSCRIPTION_ID:   ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          PLAYBOOK_RESOURCE_GROUP: ${{ vars.PLAYBOOK_RESOURCE_GROUP }}
          WHAT_IF:                 ${{ inputs.what_if }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_WORKSPACE
          Import-Module (Join-Path $repo 'Modules/iSOCDeployments/iSOCDeployments.psd1') -Force
          # Trim accidental whitespace in the repo variable; Azure treats
          # 'rg-name ' as a distinct (non-existent) resource group.
          $playbookGroup = "$env:PLAYBOOK_RESOURCE_GROUP".Trim()
          $connect = @{ SubscriptionId = $env:AZURE_SUBSCRIPTION_ID; ResourceGroup = $env:RESOURCE_GROUP; WorkspaceName = $env:WORKSPACE_NAME }
          if ($playbookGroup) { $connect['PlaybookResourceGroup'] = $playbookGroup }
          $null = Connect-iSOCWorkspace @connect
          $stage = @{ Stage = 'DefenderDetections'; RepoPath = $repo }
          if ($env:WHAT_IF -eq 'true') { $stage['WhatIf'] = $true }
          $run = Deploy-iSOCWorkspace @stage
          exit $run.ExitCode
