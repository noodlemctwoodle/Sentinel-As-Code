id: fixture-legacy-spray
displayName: "Fixture: legacy password spray"
isEnabled: false
queryCondition:
  queryText: |
    IdentityLogonEvents
    | where ActionType == "LogonSuccess"
    | project Timestamp, ReportId, AccountObjectId, AccountSid, DeviceId
  lastModifiedDateTime: "2026-03-20T00:00:00Z"
schedule:
  period: 3H
detectionAction:
  alertTemplate:
    title: "Fixture: legacy password spray"
    severity: high
    category: CredentialAccess
    mitreTechniques:
      - T1110.003
      - T1621
    impactedAssets:
      - "@odata.type": "#microsoft.graph.security.impactedUserAsset"
        identifier: accountObjectId
  responseActions:
    - "@odata.type": "#microsoft.graph.security.forceUserPasswordResetResponseAction"
      identifier: accountSid
    - "@odata.type": "#microsoft.graph.security.isolateDeviceResponseAction"
      identifier: deviceId
      isolationType: full
  organizationalScope:
    scopeNames:
      - Fixture workstations
